name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Birim testleri: altyapi gerektirmez, saniyeler surer.
  # Ayri is olarak duruyor ki bir hata gorunce "birim mi entegrasyon mu"
  # sorusunu log acmadan cevaplayabilelim.
  birim-testleri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Derle
        run: mvn -B -ntp clean compile

      - name: Birim testleri
        run: mvn -B -ntp test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: surefire-raporlari
          path: '**/target/surefire-reports/*'

  # Entegrasyon testleri (*IT) Testcontainers ile gercek Postgres, Kafka
  # ve Redis kaldirir. Yavastir; ayri is olarak kosuyor ki birim
  # testlerinin geri bildirimini geciktirmesin.
  entegrasyon-testleri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # Imajlari onden cek: Testcontainers'in varsayilan baslatma
      # zaman asimina indirme suresi de dahil ve buyuk imajlarda tasiyor.
      - name: Test imajlarini onden indir
        run: |
          docker pull postgres:16-alpine
          docker pull redis:7-alpine
          docker pull confluentinc/cp-kafka:7.7.1

      # verify = surefire + failsafe. Birim testleri burada da
      # kosuyor (birkac saniye); olmayan bir Maven ozelligiyle
      # atlamaya calismaktansa iki kez kosmasi yeglenir.
      - name: Entegrasyon testleri
        run: mvn -B -ntp clean verify

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failsafe-raporlari
          path: '**/target/failsafe-reports/*'

  # Alti servisin de imaji derleniyor mu - yayinlanmiyor, sadece dogrulama.
  imajlar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      - name: Imajlari derle
        run: |
          for s in gateway admin-api ingest-api dispatcher retry-scheduler chaos-target; do
            docker build --build-arg SERVICE=$s -t hookrelay-$s:ci .
          done
