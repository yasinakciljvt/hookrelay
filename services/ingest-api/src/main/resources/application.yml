server:
  port: 8082
  tomcat:
    threads:
      max: 200

spring:
  application:
    name: ingest-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hookrelay_ingest}
    username: ${DB_USER:hookrelay}
    password: ${DB_PASSWORD:hookrelay}
    hikari:
      maximum-pool-size: 20
      pool-name: ingest-pool

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.jdbc.batch_size: 50
      hibernate.order_inserts: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      lettuce:
        pool:
          max-active: 32

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        linger.ms: 5
        compression.type: lz4
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false

hookrelay:
  outbox:
    enabled: true
    poll-interval-ms: 100     # giris sicak yol: gecikme dusuk tutulur
    batch-size: 500
  # ingest IKI replikayi da tutar:
  #   endpoint-config → fan-out hedeflerini bulmak icin
  #   app-config      → API anahtarini dogrulamak icin
  endpoint-config:
    replicate: true
  app-config:
    replicate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      service: ingest-api

logging:
  level:
    dev.hookrelay: INFO
