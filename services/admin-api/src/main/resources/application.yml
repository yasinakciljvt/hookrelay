server:
  port: 8081

spring:
  application:
    name: admin-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hookrelay_control}
    username: ${DB_USER:hookrelay}
    password: ${DB_PASSWORD:hookrelay}
    hikari:
      maximum-pool-size: 10
      pool-name: admin-pool

  jpa:
    # Semayi Flyway yonetir. ddl-auto: none disinda bir deger, uretimde
    # veri kaybettiren tek satirdir.
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # acks=all: lider + butun senkron replikalar yazdi demeden basarili sayma.
      acks: all
      # Idempotent uretici: aglar tekrarinda ayni kaydin iki kez yazilmasini
      # broker tarafinda engeller. Kafka 3.x'te varsayilan acik ama acikca
      # yazmak, birinin acks'i dusurup bunu farkinda olmadan kapatmasini onler.
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        compression.type: lz4
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        max.poll.records: 200
    listener:
      ack-mode: batch
      concurrency: 3

hookrelay:
  outbox:
    enabled: true
    poll-interval-ms: 200
    batch-size: 200
  # admin-api replika TUTMAZ: konfigurasyonun kaynagi zaten kendi veritabani.
  endpoint-config:
    replicate: false
  app-config:
    replicate: false
  circuit-breaker:
    failure-threshold: 5
    open-millis: 30000
    half-open-probes: 2
    window-millis: 60000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      service: admin-api

logging:
  level:
    dev.hookrelay: INFO
