server:
  port: 8083

spring:
  application:
    name: dispatcher

  # Java 21 sanal is parcaciklari. Bu servisin isi neredeyse tamamen
  # "istek at, bekle" oldugu icin en cok fayda eden yer burasi.
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hookrelay_delivery}
    username: ${DB_USER:hookrelay}
    password: ${DB_PASSWORD:hookrelay}
    hikari:
      maximum-pool-size: 20
      pool-name: dispatcher-pool

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      lettuce:
        pool:
          max-active: 64

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        compression.type: lz4
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        # Bir poll'da en fazla 50 kayit. Yuksek tutmak cazip ama
        # her kayit bir HTTP istegi demek: 500 kayit alip 500 istek
        # atmaya calisirsak max.poll.interval.ms'i asar ve gruptan
        # atiliriz. Kucuk paket = sik heartbeat = saglikli tuketici.
        max.poll.records: 50
        max.poll.interval.ms: 300000
    listener:
      # MANUAL_IMMEDIATE: offset'i biz commit ediyoruz, her kayittan sonra.
      # Bkz. DeliveryConsumer javadoc — "en az bir kez" karari.
      ack-mode: manual_immediate

hookrelay:
  consumer:
    group: dispatcher
    # Ornek basina tuketici is parcacigi. 6 x 2 ornek = 12 = partition sayisi.
    concurrency: 6
  outbox:
    enabled: false          # dispatcher outbox kullanmiyor
  endpoint-config:
    replicate: true         # sicak yol icin ZORUNLU
  app-config:
    replicate: false
  delivery:
    # 4xx varsayilan olarak KALICI hata sayilir ve tek denemede DLQ'ya gider.
    # true yapmak, gecici 403 donen musteriler icin yeniden denemeyi acar.
    # 410 Gone bu ayardan etkilenmez — her zaman kalicidir.
    retry-on-4xx: false
  http:
    connect-timeout-ms: 5000
  bulkhead:
    max-concurrent-per-endpoint: 4
  circuit-breaker:
    failure-threshold: 5
    open-millis: 30000
    half-open-probes: 2
    window-millis: 60000
  retry:
    # Uretim degerleri. docker-compose demo profilinde kisaltiliyor.
    delays: 10s,1m,5m,30m,2h
    max-lifetime: 24h

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      service: dispatcher

logging:
  level:
    dev.hookrelay: INFO
